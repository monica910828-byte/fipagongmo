name: FiPA Auto Sync (09:00 & 15:00 KST)

on:
  schedule:
    # UTC 00:00 = 한국시간(KST) 매일 오전 09:00
    - cron: '0 0 * * *'
    # UTC 06:00 = 한국시간(KST) 매일 오후 15:00
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '15분 쿨다운을 무시하고 즉시 강제 동기화 실행 여부 (true/false)'
        required: false
        default: 'true'

jobs:
  sync-fipa-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger FiPA Auto Sync on Vercel
        env:
          SITE_URL: ${{ vars.FIPA_SITE_URL || 'https://fipagongmo.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          FORCE_PARAM="${{ github.event.inputs.force || 'false' }}"
          TARGET_URL="${SITE_URL}/api/cron/sync?slot=gh&source=GITHUB_ACTIONS&force=${FORCE_PARAM}"
          echo "Triggering FiPA auto sync: ${TARGET_URL}"

          if [ -n "${CRON_SECRET}" ]; then
            RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" --max-time 90 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${TARGET_URL}")
          else
            RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" --max-time 90 \
              "${TARGET_URL}")
          fi

          HTTP_BODY=$(echo "${RESPONSE}" | sed -e 's/HTTP_STATUS\:.*//g')
          HTTP_STATUS=$(echo "${RESPONSE}" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')

          echo "HTTP Status: ${HTTP_STATUS}"
          echo "Response: ${HTTP_BODY}"

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            echo "Sync failed with status ${HTTP_STATUS}"
            exit 1
          fi
